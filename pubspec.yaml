name: runmyai
description: "Run My AI - run AI models on your own computer"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  flutter_riverpod: ^3.4.3
  path_provider: ^2.1.6
  screen_retriever: ^0.2.2
  sqlite3: ^3.8.0
  window_manager: ^0.5.2
  file_selector: ^1.1.0
  crypto: ^3.0.6
  archive: ^4.7.1
  flutter_math_fork: ^0.7.4
  re_highlight: ^0.0.3
  ed25519_edwards: ^0.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/app-icon/
    - assets/dummy/
    - assets/sounds/
    - assets/licenses/
    - assets/author/
    - assets/benchmark/
    - assets/benchmark/stories/
